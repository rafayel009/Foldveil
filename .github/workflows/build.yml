name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o Foldveil.zip -d extracted
          SRC=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
          cp -r "$SRC"/. .
          rm -f gradlew gradlew.bat
          rm -rf gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
          
      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foldveil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
