name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - - name: Unzip project
        run: |
          unzip -o Foldveil.zip -d extracted
          ls -la extracted
          SRC=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "Found project folder: $SRC"
          cp -r "$SRC"/. .
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foldveil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
